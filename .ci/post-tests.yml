---
platform: linux
image_resource:
  type: registry-image
  source:
    repository: cycloid/concourse-dind
    tag: latest
run:
  path: concourse-dind-entrypoint.sh
  args:
    - 'bash'
    - '-exc'
    - |
      source /opt/docker-utils.sh
      docker_load image/image.tar


      export IMAGE_NAME="${REPOSITORY}:${TAG}"
      docker tag $(cat image/digest) $IMAGE_NAME
      docker inspect $IMAGE_NAME

      # upgrade first: the dind image's preinstalled libs (libexpat & co) lag the
      # index, and apk won't bump them for a soname-satisfied dependency
      apk update && apk upgrade -q --no-progress && apk add -q --no-progress python3 py-pip
      python3 -m pip install -q --break-system-packages -r merged-stack/tests-requirements.txt

      cd merged-stack
      # Skip tests for light image because most of the binaries are not present
      if [[ "$TAG" != "light" ]]; then
        python3 tests.py -vvv
      fi
inputs:
- name: merged-stack
- name: image
params:
  REPOSITORY: image
  TAG: latest
